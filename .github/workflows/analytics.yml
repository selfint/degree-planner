name: Analytics validation

on:
  pull_request:
    paths:
      - 'src/**'
      - '.env.production'
      - 'analytics-tests/**'
      - 'playwright.analytics.config.ts'
      - 'package*.json'
      - '.github/workflows/analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-24.04
    # Reuse the pinned browser image; no APT or browser downloads at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        base: ['', '/degree-planner']
    env:
      BASE_PATH: ${{ matrix.base }}
      PUBLIC_POSTHOG_KEY: phc_test_only
      PUBLIC_POSTHOG_HOST: https://posthog.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Existing unit fixtures are root-relative; prefix coverage uses built browser tests.
      - run: BASE_PATH='' npm run test:unit -- --run
      - run: npm run build:pages
      - run: npx playwright test --config playwright.analytics.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analytics-qa-${{ strategy.job-index }}
          path: test-results/
