name: In-app tutorial refresh

on:
  push:
    branches: ['staging']
    paths: ['.github/workflows/in-app-tutorial-refresh.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-course:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --project tutorials/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - name: Install video packaging tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Record only the four affected in-app search-and-plan variants
        run: PW_DEMO=on npx playwright test --config=playwright.tutorials.config.ts tutorials/recordings.spec.ts --grep 'search and plan tutorial' --workers=1
      - name: Package the asserted plan-course recordings
        run: node scripts/packageTutorialVideos.mjs --topic=plan-course
      - uses: actions/upload-artifact@v4
        with:
          name: in-app-plan-course-${{ github.sha }}
          path: test-results/tutorials-media/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-app-plan-course-evidence-${{ github.sha }}
          path: |
            test-results/tutorials-checks/
            test-results/tutorials-raw/
          retention-days: 7
          if-no-files-found: ignore
