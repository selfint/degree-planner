name: Pages staging

on:
  push:
    branches: ['feat/github-pages-staging']
  pull_request:
    branches: ['staging']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to the existing repository Pages site (replaces its current content)'
        type: boolean
        default: false
      expected_url:
        description: 'Exact approved Pages URL; required for publication'
        type: string
        default: 'https://tom.selfin.io/degree-planner/'

permissions:
  contents: read

env:
  APPROVED_PAGES_URL: https://tom.selfin.io/degree-planner/

jobs:
  inspect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    steps:
      - name: Read the existing Pages source and destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages > pages.json
          jq '{html_url, cname, build_type, source}' pages.json
          test "$(jq -r '.html_url' pages.json | sed 's:/*$::')" = "${APPROVED_PAGES_URL%/}"

  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base: ['', '/degree-planner']
    env:
      PAGES_BUILD: 'true'
      # Static-host QA must not send events to the production analytics project.
      PUBLIC_POSTHOG_KEY: ''
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Test the actual static artifact (no SSR server)
        run: npx playwright test --config playwright.pages.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-qa-${{ strategy.job-index }}
          path: test-results/

  # The owner approved replacing this existing Pages site on 2026-11-03.
  # Keep the branch and exact destination bounded; never change a custom domain.
  deploy:
    if: github.ref == 'refs/heads/feat/github-pages-staging' && (github.event_name == 'push' || (inputs.deploy && inputs.expected_url == 'https://tom.selfin.io/degree-planner/'))
    needs: [inspect, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-staging-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refuse publication to an unapproved existing site
        env:
          ACTUAL_URL: ${{ steps.pages.outputs.base_url }}
          EXPECTED_URL: ${{ env.APPROVED_PAGES_URL }}
        run: |
          test "${ACTUAL_URL%/}" = "${EXPECTED_URL%/}" || {
            echo 'The configured Pages destination differs from the approved URL.'
            exit 1
          }
      - name: Verify Pages uses the approved Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api repos/${{ github.repository }}/pages --jq '.build_type')
          if [ "$mode" != 'workflow' ]; then
            echo "::error::Pages uses $mode publishing. The repository owner must select GitHub Actions under Settings > Pages > Build and deployment; the workflow token cannot change that administrative setting."
            exit 1
          fi
      - run: npm ci
      - run: npm run build:pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - uses: actions/deploy-pages@v4
        id: deployment
