name: Test

on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

jobs:
  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: webkit
            project: webkit*
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npm run test:integration -- --project="${{ matrix.project }}"
      - name: Upload browser recordings, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare test data and SvelteKit
        run: npm run generate-catalogs && npx svelte-kit sync
      - name: Run unit tests
        run: npm run test:unit -- --run

  sap:
    name: Live SAP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare SvelteKit config
        run: npx svelte-kit sync
      - name: Run live SAP tests
        run: npm run test:sap
