name: Test

on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

jobs:
  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: webkit
            project: webkit*
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify narrow mobile controls, board and course rails before the full suite
        run: npx playwright test tests/console-button-layout.test.ts tests/plan-board-alignment.test.ts tests/course-catalog-rails.test.ts --project="${{ matrix.project }}" --max-failures=1
      - name: Upload focused board alignment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-alignment-${{ matrix.browser }}
          path: |
            test-results/plan-board-alignment-*/
            test-results/course-catalog-rails-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify short-screen drops and signed-in offline recovery
        if: matrix.browser == 'chromium'
        run: npx playwright test tests/plan-mobile-drag.test.ts tests/pwa.test.ts --project=chromium --grep "drop zones remain|signed-in offline users" --max-failures=1
      - name: Run browser tests
        run: npm run test:integration -- --project="${{ matrix.project }}"
      - name: Test the built worker and IndexedDB ownership boundary
        if: matrix.browser == 'chromium'
        run: npx vitest run --config vitest.integration.config.ts
      - name: Compare full-shell mobile density against the pinned baseline
        if: (success() || failure()) && matrix.browser == 'chromium'
        run: node scripts/checkMobileDensity.mjs
      - name: Upload browser recordings, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare test data and SvelteKit
        run: npm run generate-catalogs && npx svelte-kit sync
      - name: Run unit tests
        run: npm run test:unit -- --run

  sap:
    name: Live SAP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare SvelteKit config
        run: npx svelte-kit sync
      - name: Run live SAP tests
        run: npm run test:sap

  deployed-console-mobile:
    # Only our migration branch owns this preview alias. Never test a fork or a
    # newer branch build while labelling it as the PR event's exact head.
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/console-migration' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      statuses: read
    env:
      PREVIEW_URL: ${{ vars.DEGREE_PLANNER_PREVIEW_URL || 'https://degree-planner-git-feat-console-migration-selfints-projects.vercel.app/' }}
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install focused browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Wait for the current head's Vercel deployment
        id: preview-ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/waitForPreview.mjs
      - name: Test the published console on mobile
        run: npx playwright test --config=playwright.preview.config.ts
      - name: Verify published course and catalog rails on mobile
        if: (success() || failure()) && steps.preview-ready.outcome == 'success'
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_URL }}
        run: npx playwright test --config=playwright.rails-preview.config.ts
      - name: Test the published Storybook route
        if: (success() || failure()) && steps.preview-ready.outcome == 'success'
        env:
          STORYBOOK_TEST_BASE_URL: ${{ env.PREVIEW_URL }}
        run: npm run test:storybook
      - name: Verify the preview branch was not superseded during QA
        if: (success() || failure()) && steps.preview-ready.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/waitForPreview.mjs --verify-only
      - name: Upload sanitized deployed-preview QA and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-console-mobile-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/deployed-preview/
            test-results/deployed-preview-gate/
            test-results/deployed-rails/
            test-results/storybook/
          if-no-files-found: ignore
          retention-days: 7
