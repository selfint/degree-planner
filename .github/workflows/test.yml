name: Test

on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

jobs:
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run browser tests
        run: npm run test:integration
      - name: Upload landing visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-parallax-visuals
          path: test-results/**/landing-*.png
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare test data and SvelteKit
        run: npm run generate-catalogs && npx svelte-kit sync
      - name: Run unit tests
        run: npm run test:unit -- --run

  sap:
    name: Live SAP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare SvelteKit config
        run: npx svelte-kit sync
      - name: Run live SAP tests
        run: npm run test:sap

  parallax-browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        run: npm install && npx playwright install --with-deps chromium webkit
      - name: Test parallax in Chromium and WebKit
        run: npx playwright test --config=playwright.parallax.config.ts
      - name: Upload scroll recordings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-browser-recordings
          path: test-results/
          retention-days: 7

  search-browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        run: npm install && npx playwright install --with-deps chromium webkit
      - name: Test native faculty selection in Chromium and WebKit
        run: npx playwright test --config=playwright.search.config.ts
      - name: Upload search failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: search-browser-failures
          path: test-results/
          retention-days: 7
