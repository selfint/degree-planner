name: Test

on:
  push:
    branches: 'main'
  pull_request:
    branches: 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm install && npx playwright install
      - name: test
        run: npm run test
      - name: Upload landing visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-parallax-visuals
          path: test-results/**/landing-*.png
          if-no-files-found: ignore
          retention-days: 7

  parallax-browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        run: npm install && npx playwright install --with-deps chromium webkit
      - name: Test parallax in Chromium and WebKit
        run: npx playwright test --config=playwright.parallax.config.ts
      - name: Upload scroll recordings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-browser-recordings
          path: test-results/
          retention-days: 7

  search-browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        run: npm install && npx playwright install --with-deps chromium webkit
      - name: Test native faculty selection in Chromium and WebKit
        run: npx playwright test --config=playwright.search.config.ts
      - name: Upload search failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: search-browser-failures
          path: test-results/
          retention-days: 7

  pwa-browsers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PWA browser test dependencies
        run: npm install && npx playwright install --with-deps chromium
      - name: Test install, offline cold routes, account guards and safe updates
        run: npx playwright test tests/pwa.test.ts --workers=1
      - name: Test the built worker and IndexedDB ownership boundary
        run: npx vitest run --config vitest.integration.config.ts
      - name: Upload PWA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-failures
          path: test-results/
          retention-days: 7
