name: Test

on:
  push:
    branches: ['main', 'staging']
  pull_request:
    branches: ['main', 'staging']

# Disable PostHog ingestion in locally built test artifacts.
env:
  PUBLIC_POSTHOG_KEY: ''

jobs:
  quality:
    name: Types, formatting and ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate catalog snapshot and prepare derived data
        run: npm run generate-catalogs
      - name: Check types and Svelte diagnostics
        run: npm run check
      - name: Check authored source formatting and ESLint rules
        run: npm run lint

  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    # Same pinned image as Pages: browsers and OS dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --user 1001:1001 --shm-size=1g
    # Match the runner-owned checkout without weakening Git trust checks.
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: webkit
            project: webkit*
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify account loading and interrupted auth
        run: npx playwright test --config playwright.account-loading.config.ts --project=${{ matrix.browser }}
      - name: Verify narrow mobile controls, board and course rails before the full suite
        run: npx playwright test tests/course-actions-loading.test.ts tests/plan-dependencies.test.ts tests/search-focus.test.ts tests/pwa-browser-links.test.ts tests/console-button-layout.test.ts tests/footer-controls.test.ts tests/console-navigation-styles.test.ts tests/search-three-columns.test.ts tests/plan-board-alignment.test.ts tests/course-catalog-rails.test.ts tests/remaining-course-rails.test.ts tests/search-faculty-width.test.ts tests/student-journeys.test.ts --project="${{ matrix.project }}"
      - name: Upload focused board alignment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-alignment-${{ matrix.browser }}
          path: |
            test-results/course-actions-loading-*/
            test-results/plan-dependencies-*/
            test-results/search-focus-*/
            test-results/pwa-browser-links-*/
            test-results/console-button-layout-*/
            test-results/plan-board-alignment-*/
            test-results/footer-controls-*/
            test-results/console-navigation-styles-*/
            test-results/search-three-columns-*/
            test-results/course-catalog-rails-*/
            test-results/remaining-course-rails-*/
            test-results/search-faculty-width-*/
            test-results/student-journeys-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify short-screen drops and signed-in offline recovery
        if: matrix.browser == 'chromium'
        run: npx playwright test tests/plan-mobile-drag.test.ts tests/pwa.test.ts --project=chromium --grep "drop zones remain|signed-in offline users" --max-failures=1
      - name: Run browser tests
        # Keep the full lifecycle/interaction evidence even when an earlier
        # focused assertion fails. That failure still fails the overall job.
        if: success() || failure()
        run: npm run test:integration -- --project="${{ matrix.project }}"
      - name: Test the built worker and IndexedDB ownership boundary
        if: matrix.browser == 'chromium'
        run: npx vitest run --config vitest.integration.config.ts
      - name: Compare full-shell mobile density against the pinned baseline
        if: (success() || failure()) && matrix.browser == 'chromium'
        run: node scripts/checkMobileDensity.mjs
      - name: Upload browser recordings, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare test data and SvelteKit
        run: npm run generate-catalogs && npx svelte-kit sync
      - name: Run unit tests
        run: npm run test:unit -- --run

  sap:
    name: Live SAP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare SvelteKit config
        run: npx svelte-kit sync
      - name: Run live SAP tests
        run: npm run test:sap

  local-console-mobile:
    name: Local console, rails and Storybook
    runs-on: ubuntu-24.04
    # Same pinned image as Pages: browsers and OS dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --user 1001:1001 --shm-size=1g
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Bind localhost consistently for Node proxies and browser requests.
      NODE_OPTIONS: --dns-result-order=ipv4first
      PLANIT_QA_PREBUILT: '1'
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      STORYBOOK_TEST_BASE_URL: http://localhost:4175
      QA_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install focused browser test dependencies
        run: npm ci
      - name: Build the local production artifact including Storybook
        id: local-build
        run: npm run build
      - name: Test the local console on mobile
        run: npx playwright test --config=playwright.preview.config.ts
      - name: Verify local course rails and footer controls on mobile
        if: (success() || failure()) && steps.local-build.outcome == 'success'
        run: npx playwright test --config=playwright.rails-preview.config.ts
      - name: Test every local Storybook story and interaction
        if: (success() || failure()) && steps.local-build.outcome == 'success'
        run: npm run test:storybook
      - name: Upload sanitized local QA and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-console-mobile-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/local-preview/
            test-results/local-rails/
            test-results/storybook/
          if-no-files-found: ignore
          retention-days: 7
