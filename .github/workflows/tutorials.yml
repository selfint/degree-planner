name: Tutorial videos

on:
  push:
    branches: ['staging']
    paths:
      - 'tutorials/**'
      - 'tutorials/landing.test.ts'
      - 'playwright.tutorials.config.ts'
      - 'scripts/packageTutorialVideos.mjs'
      - 'scripts/tutorialTimeline*'
      - 'src/**'
      - 'static/courseData.json'
      - 'static/tutorials/**'
      - '.github/workflows/tutorials.yml'
  pull_request:
    branches: ['main', 'staging']
    paths:
      - 'tutorials/**'
      - 'tutorials/landing.test.ts'
      - 'src/**'
      - 'static/courseData.json'
      - 'static/tutorials/**'
      - 'playwright.tutorials.config.ts'
      - 'scripts/packageTutorialVideos.mjs'
      - 'scripts/tutorialTimeline*'
      - '.github/workflows/tutorials.yml'

permissions:
  contents: read

jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check tutorial helpers and scenarios before recording
        run: npx tsc --project tutorials/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - name: Install video packaging tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check landing behavior and record asserted app tutorials
        run: PW_DEMO=on npx playwright test --config=playwright.tutorials.config.ts
      - name: Check production-rendered tutorial semantics
        if: success() || failure()
        run: node --test tutorials/ssr.test.mjs
      - name: Package recorded videos, posters and captions
        if: success() || failure()
        run: node scripts/packageTutorialVideos.mjs --group=all
      - name: Upload tutorial evidence and generated public assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorials-${{ github.sha }}
          path: |
            test-results/tutorials-checks/
            test-results/tutorials-raw/
            test-results/tutorials-media/
          retention-days: 7
          if-no-files-found: error
