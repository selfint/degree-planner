name: Tutorial videos

on:
  push:
    branches: ['staging']
    paths:
      - 'tutorials/**'
      - 'tutorials/landing.test.ts'
      - 'playwright.tutorials.config.ts'
      - 'scripts/packageTutorialVideos.mjs'
      - 'src/routes/+page.svelte'
      - 'src/routes/components/Tutorial*.svelte'
      - 'src/lib/tutorials.ts'
      - 'static/tutorials/**'
      - '.github/workflows/tutorials.yml'
  pull_request:
    branches: ['main', 'staging']
    paths:
      - 'tutorials/**'
      - 'tutorials/landing.test.ts'
      - 'src/routes/components/Tutorial*.svelte'
      - 'src/lib/tutorials.ts'
      - '.github/workflows/tutorials.yml'

permissions:
  contents: read

jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check landing tutorial behavior (red before UI implementation)
        run: |
          mkdir -p test-results
          set +e
          npx playwright test --config=playwright.tutorials.config.ts tutorials/landing.test.ts --grep '^landing tutorials en light 320$' --reporter=json > test-results/tutorial-red.json
          result=$?
          set -e
          node scripts/assertTutorialRed.mjs "$result"
      - name: Record asserted app tutorials in both languages and themes
        if: success() || failure()
        run: PW_DEMO=on npx playwright test --config=playwright.tutorials.config.ts tutorials/recordings.spec.ts
      - name: Package recorded videos, posters and captions
        if: success() || failure()
        run: node scripts/packageTutorialVideos.mjs
      - name: Upload tutorial evidence and generated public assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorials-${{ github.sha }}
          path: |
            test-results/tutorial-red.json
            test-results/tutorials-checks/
            test-results/tutorials-raw/
            test-results/tutorials-media/
          retention-days: 7
          if-no-files-found: error
