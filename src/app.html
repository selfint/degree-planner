<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<script>
			// Restore the device preference before styles or content can paint.
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
			} catch {
				// Keep the default dark theme when browser storage is unavailable.
			}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.webp" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#15252e" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="PlanIt" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@100..900&family=Pacifico&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media = 'all'"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
		<title>PlanIt</title>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
